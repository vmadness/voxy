        dependencies {
            modRuntimeOnly(arg)
        }
    }
}

// Declares one optional/compat-mod dependency read from gradle.properties, with a per-property
// override convention so CI and local dev can pin different versions without editing this file:
//   - "runtime.<property>" set   -> use that version, forced to runtime-only (compile=false semantics
//                                    via runtime=true below; see the compile&&runtime branching).
//   - "compileOnly.<property>" set -> use that version, forced to compile-only (not shipped at runtime).
//   - neither set                -> fall back to the plain "<property>" value with the caller's
//                                    runtime/compile defaults.
// If the resolved version string ends in ".jar" it's treated as a local file dependency instead of
// a maven coordinate.
//
// Params:
//   property         - the gradle.properties key to read (e.g. "sodium_version"); also used to
//                       derive the default modrinth maven coordinate ("maven.modrinth:<prefix>") when
//                       `maven` is null, using the part of the property name before the first "_".
//   runtime          - whether the dependency should be available at runtime; combined with
//                       `compile` to pick modImplementation/modCompileOnly/modRuntimeOnlyMsk. May be
//                       overridden by the runtime./compileOnly. property convention above.
//   maven            - explicit maven coordinate prefix (without ":<version>"); null derives one
//                       from `property` as described above.
//   compile          - whether the dependency should be available at compile time (see `runtime`).
//   patchLoomVersion - if true, run the resolved jar through patchLoomVersionJar() (see above) to
//                       work around Loom's Fabric-Loom-Version gate before adding it as a dependency.
// Returns the resolved version string, or null if the property wasn't set (dependency skipped).
def smartDependency(String property, boolean runtime = false, String maven = null, boolean compile = true, boolean patchLoomVersion = false) {
    String ver;
    if (project.hasProperty("runtime."+property)) {
        ver = project["runtime."+property];
        runtime = true
    } else if (project.hasProperty("compileOnly."+property)) {
        ver = project["compileOnly."+property];
        runtime = false
    }  else {
        ver = project[property];
    }

    if (ver == null) {
        return null;
    }

    Object dep;
    if (ver.endsWith(".jar")) {
        //File type
        dep = file(ver)
    } else {//Asume mvn
        //Hack, default modrinth maven
        if (maven == null) {
            maven = "maven.modrinth:"+(property.split("_")[0])
        }

        dep = (maven!=null?(maven+":"):"")+ver;
    }
    if (patchLoomVersion) {
        dep = patchLoomVersionJar(dep)
    }
    dependencies {
        if (compile && runtime) {
            modImplementation(dep)
        } else {
            if (compile) {
                modCompileOnly(dep)
            } else {
                modRuntimeOnlyMsk(dep)
            }
        }
    }
    return ver
}

