// 1.21.1 port workaround: sodium mc1.21.1-0.8.12 was built with Loom 1.16.1
// (with `Fabric-Loom-Mixin-Remap-Type: static`), and Loom's ArtifactMetadata
// hard-fails consuming any static-remap mod whose recorded Loom version is
// newer than the running one ("Mod was built with a newer version of Loom").
// We must run Loom 1.13.6 (the newest release that still has the
// obfuscation/mojmap remap pipeline; 1.14+ force disableObfuscation), and
// 1.13.6 fully supports STATIC mixin remap -- the gate is just a
// conservative major.minor comparison. This rewrites that one manifest
// attribute in a copy of the jar so Loom accepts it. Remove when moving to a
// Loom that passes the version gate naturally.
def patchLoomVersionJar(Object depNotation) {
    def dep = (depNotation instanceof CharSequence) ? project.dependencies.create(depNotation.toString()) : depNotation
    def cfg = project.configurations.detachedConfiguration(dep)
    cfg.transitive = false
    def jarFile = cfg.resolve().find { it.name.endsWith(".jar") }
    if (jarFile == null) {
        return depNotation
    }

    def patchedModsDir = new File(project.buildDir, "patchedMods")
    patchedModsDir.mkdirs()
    def outFile = new File(patchedModsDir, "loomver-" + jarFile.name.replaceAll('[^A-Za-z0-9._-]', '_'))

    if (!outFile.exists() || outFile.lastModified() < jarFile.lastModified()) {
        new java.util.zip.ZipFile(jarFile).withCloseable { zin ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(outFile)).withCloseable { zout ->
                zin.entries().each { entry ->
                    byte[] data = zin.getInputStream(entry).bytes
                    if (entry.name == "META-INF/MANIFEST.MF") {
                        def text = new String(data, "UTF-8")
                        text = text.replaceAll(/(?m)^Fabric-Loom-Version: .*$/, "Fabric-Loom-Version: 1.13.6")
                        data = text.getBytes("UTF-8")
                    }
                    def newEntry = new java.util.zip.ZipEntry(entry.name)
                    newEntry.setTime(entry.getTime())
                    zout.putNextEntry(newEntry)
                    zout.write(data)
                    zout.closeEntry()
                }
            }
        }
    }
    return project.files(outFile)
}

def findSodiumVersion() {
    var sodium_entry = (Map.Entry<String,String>)project.properties.find {it.key.contains("sodium_version")}
    var props = sodium_entry.key.split("\\.");
    var key = props.last();
    props = props[0..props.size()-1];
    String version_str;
    boolean modrinth_version = key.endsWith("_modrinth");
    if (modrinth_version) {
        version_str = (sodium_entry.value=~/[^-]*-([^-]*-?[^-]*)-.*/)[0][1];
    } else {
        version_str = sodium_entry.value.split("\\+")[0];
    }
    return [props, modrinth_version, sodium_entry.value, version_str];
}

processResources {
    String sodium_versions;
    {
        StringBuilder sodium_versions_builder = new StringBuilder("[");
        var vers = [*project.properties.getOrDefault("sodium_extra_allows", "").split(" ")];
        vers.add("0.0.0");//Sodium dummy provider 0.0.0
        for (String ver : vers) {
            if (!ver.isBlank()) {
                sodium_versions_builder.append("\"=").append(ver).append("\", ");
            }
        }

        var (props, _, _2, sodium_version) = findSodiumVersion();
        var expectExact = props.contains("exact");

        if (expectExact) {
            sodium_versions_builder.append("\"=").append(sodium_version).append("\"");
        } else {
            sodium_version = sodium_version.split("-")[0]
            sodium_versions_builder.append("\">=").append(sodium_version).append("- <=").append(sodium_version).append("\"")
        }
        sodium_versions_builder.append("]");
        sodium_versions = sodium_versions_builder.toString();
    }
    String allowed_mc_version;
    {
        allowed_mc_version = project.properties.minecraft_version.split("-")[0];
        allowed_mc_version = "[\">=" + allowed_mc_version + "- <=" + allowed_mc_version + "\", \"~" + allowed_mc_version + "\"]";
    }

    var time = buildtime()
    var hash = gitCommitHash()
    var version = project.version

    def props = ["version": version, "commit": hash, "buildtime": time, "allowed_sodium_versions": sodium_versions, "allowed_mc_version": allowed_mc_version]

    for (var prop : props) {
        String value = prop.value;
        if (!(value==~/^ *((['"\[{].*)|([0-9]*$))/)) {
            value = "\"$value\"";
        }
        props[prop.key] = value
    }

    inputs.properties(props);
    filesMatching("fabric.mod.json") {
        filter {line->line.replace("\"\${","\${").replace("}\"", "}")};
        expand(props);
    }
}

