// 1.21.1 port: with the obfuscation/remap pipeline active (loom 1.13.x,
// mojmap), all mod dependencies must go through loom's remapping
// configurations (modImplementation/modCompileOnly/modRuntimeOnly). Dev's
// 26.x build used plain configurations because its loom line (1.14+) ran
// fully unobfuscated. Mirrors the reference 1.21.1 port's build.gradle.
def modRuntimeOnlyMsk = {arg->}
if (!isInGHA) {
