tasks.register("verifyDedicatedLwjglPackaging") {
    group = "verification"
    description = "Verifies that the release jar is self-contained for dedicated-server LWJGL use"
    dependsOn tasks.named("remapJar")

    doLast {
        def releaseJar = tasks.named("remapJar").get().archiveFile.get().asFile
        def requiredNestedJars = [
                "META-INF/jars/lwjgl-${lwjglVersion}.jar",
                "META-INF/jars/lwjgl-${lwjglVersion}-natives-linux.jar",
                "META-INF/jars/lwjgl-${lwjglVersion}-natives-windows.jar"
        ]
        def requiredClasses = [
                "org/lwjgl/system/MemoryStack.class",
                "org/lwjgl/system/MemoryUtil.class"
        ] as Set

        new java.util.zip.ZipFile(releaseJar).withCloseable { outer ->
            requiredNestedJars.each { entryName ->
                if (outer.getEntry(entryName) == null) {
                    throw new GradleException("Dedicated Voxy artifact is missing ${entryName}")
                }
            }

            def coreEntry = outer.getEntry(requiredNestedJars[0])
            def foundClasses = [] as Set
            outer.getInputStream(coreEntry).withCloseable { coreInput ->
                new java.util.zip.ZipInputStream(coreInput).withCloseable { nested ->
                    for (def entry = nested.nextEntry; entry != null; entry = nested.nextEntry) {
                        if (requiredClasses.contains(entry.name)) foundClasses.add(entry.name)
                    }
                }
            }
            if (foundClasses != requiredClasses) {
                throw new GradleException("Nested lwjgl-core is missing ${requiredClasses - foundClasses}")
            }
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("commonInvariantTest")
    dependsOn tasks.named("verifyDedicatedLwjglPackaging")
}

tasks.named("test") {
    // Common invariants use a dependency-free JavaExec harness instead of a test framework.
    failOnNoDiscoveredTests = false
}
