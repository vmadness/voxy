# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon = false

# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=1.21.1
loader_version=0.19.3
# 1.21.1 port: loom 1.13.6 is the newest pre-1.14 release; the 1.14+ lines
# force disableObfuscation (no mojmap remap pipeline) for single-project
# builds. Old releases live under the legacy `fabric-loom` plugin id, not
# `net.fabricmc.fabric-loom` (which dev's 26.x build used).
loom_version=1.13.6

# Fabric API
fabric_api_version=0.116.6+1.21.1
sodium_version_modrinth=mc1.21.1-0.8.12-fabric
#sodium_version=0.9.0-beta.3+mc26.2r1
sodium_extra_allows=

modmenu_version=11.0.3
lithium_version=mc1.21.1-0.15.0-fabric

runtime.iris_version=1.8.14-beta.1+1.21.1-fabric

# nvidium/vivecraft/flashback/chunky: T13, compile-only optional compat, gated at
# runtime by VoxyMixinPlugin/isModLoaded (see PORT_1211.md T13). Versions are 1.21.1
# fabric builds verified against the Modrinth API (github releases for nvidium).
chunky_version=1.4.23-fabric
vivecraft_version=1.21.1-1.3.15-fabric
flashback_version=rNCr1Rbs
# nvidium isn't on Modrinth under maven.modrinth conventions here; version string is
# passed straight through to the github ivy coordinate "drouarb:nvidium:<this>".
nvidium_version=0.4.1-beta9:1.21-1.21.1@jar


# Mod Properties
mod_version = 0.2.18-beta.voxyserver.1
maven_group = me.cortex
archives_base_name = voxy
